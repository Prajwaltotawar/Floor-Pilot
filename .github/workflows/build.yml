name: Build CAD Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android wrapper
        run: flutter create --platforms=android --project-name floor_planner --org com.cadstudio.floorplanner .

      - name: Set app name
        run: |
          sed -i 's|android:label="[^"]*"|android:label="Floor Pilot"|' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Create icon image
        run: |
          mkdir -p assets
          pip install pillow
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (1024, 1024), (17, 24, 32))
          d = ImageDraw.Draw(img)
          d.rectangle([220, 220, 804, 804], outline=(47, 155, 255), width=60)
          d.line([220, 512, 804, 512], fill=(255, 255, 255), width=50)
          img.save('assets/icon.png')
          "

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Floor-Pilot-APK
          path: build/app/outputs/flutter-apk/app-release.apk
